[general]
rtpstart=10000
rtpend=20000
strictrtp=no
; ICE on. STUN = Google public — reachable & fast (verified), so it gives Asterisk
; a srflx (public) ICE candidate so a phone OFF the LAN can receive RTP. This fixes
; the "408 RTP Timeout / no audio" for remote WebRTC callers (video survives via HLS).
; Do NOT restore the old 212.42.101.219 — it was DEAD and blocked RTP ~9s (broke LAN
; calls). Google STUN answers in ms, so there is no LAN-call block.
icesupport=yes
stunaddr=stun.l.google.com:19302
; TURN relay-fallback for SYMMETRIC-NAT phones (srflx can't traverse those). Fill in
; once devops issues creds for turn-dev.docx.kg, then `module reload res_rtp_asterisk.so`:
; turnaddr=turn-dev.docx.kg:3478
; turnusername=<devops>
; turnpassword=<devops>
