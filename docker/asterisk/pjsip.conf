[transport-udp]
type=transport
protocol=udp
bind=0.0.0.0:5060
; network_mode: host — Asterisk напрямую на IP хоста 192.168.31.132
; external_ адреса не нужны, локальные сети тоже не нужны

; WebSocket transport для SIP из браузера (JsSIP)
[transport-ws]
type=transport
protocol=ws
bind=0.0.0.0:8088

; === Браузер (browser SIP client) ===
[1099]
type=endpoint
context=intercom
disallow=all
allow=opus
allow=g722
allow=ulaw
allow=h264
allow=alaw
auth=auth1099
aors=1099
direct_media=no
rtp_symmetric=yes
force_rport=yes
ice_support=yes
rewrite_contact=yes
media_use_received_transport=yes
dtmf_mode=rfc4733
rtcp_mux=yes
allow_transfer=no
transport=transport-ws
webrtc=yes

[auth1099]
type=auth
auth_type=userpass
username=1099
password=BrowserSip1099

[1099]
type=aor
max_contacts=5
remove_existing=no
qualify_frequency=0
; === end browser ===

; Глобальные настройки — запрещаем direct media глобально
[global]
type=global
max_forwards=70
default_from_user=intercom
keep_alive_interval=30
user_agent=Asterisk
; Realm для Digest-аутентификации — клиент должен передавать его в Authorization
; Совпадает с sip_domain (PUBLIC_BRIDGE_HOST или SERVER_IP) из bridge настроек
default_realm=192.168.31.132

; WebRTC-эндпоинты мобильных клиентов (генерируется бэкендом автоматически)
#include "pjsip_webrtc.conf"

