# MQTT broker for the Leelen panel's "Leelen IoT 3.0" (lliot/dmgr) channel.
# Capture/dev config: anonymous + verbose logging so we can watch the panel
# connect, subscribe and publish (door_state_up_by_mqtt / dmgr.reportPIIDS).
# NOTE: open/anonymous — lock down (auth + ACL) before any production use.

listener 1883 0.0.0.0
allow_anonymous true

persistence true
persistence_location /mosquitto/data/

log_dest stdout
log_type all
connection_messages true
